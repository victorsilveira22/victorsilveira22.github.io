<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocabella - Beleza e Inovação</title>
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      color: #333;
    }
    header {
      background: #000;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 24px;
      letter-spacing: 2px;
    }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
    }
    nav a:hover {
      border-bottom: 2px solid #fff;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1607082349566-187342175e2b?auto=format&fit=crop&w=1350&q=80') no-repeat center/cover;
      height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .hero h2 {
      font-size: 48px;
      max-width: 700px;
    }
    .products {
      padding: 50px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: auto;
    }
    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }
    .product:hover {
      transform: translateY(-5px);
    }
    .product img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }
    .product h3 {
      margin: 15px 0 5px;
      font-size: 20px;
    }
    .product p {
      font-size: 16px;
      margin: 5px 0 15px;
    }
    .btn {
      background: #000;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn:hover {
      background: #444;
    }
    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    #cart {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #000;
      color: white;
      padding: 15px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1>Bocabella</h1>
    <nav>
      <a href="#">Início</a>
      <a href="#produtos">Produtos</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Beleza, tecnologia e inovação em um só lugar</h2>
  </section>

  <section id="produtos" class="products">
    <div class="product">
      <img src="https://images.unsplash.com/photo-1607082349504-607b6b6e5f24?auto=format&fit=crop&w=600&q=80" alt="Batom">
      <h3>Batom Luxo</h3>
      <p>R$59,90</p>
      <a href="#" class="btn" onclick="addToCart('Batom Luxo', 59.90)">Adicionar ao carrinho</a>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1607082349522-1e3c6d5327f7?auto=format&fit=crop&w=600&q=80" alt="Base">
      <h3>Base Perfeita</h3>
      <p>R$89,90</p>
      <a href="#" class="btn" onclick="addToCart('Base Perfeita', 89.90)">Adicionar ao carrinho</a>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1607082349619-c59ff9bfb2d3?auto=format&fit=crop&w=600&q=80" alt="Paleta">
      <h3>Paleta Premium</h3>
      <p>R$129,90</p>
      <a href="#" class="btn" onclick="addToCart('Paleta Premium', 129.90)">Adicionar ao carrinho</a>
    </div>
  </section>

  <footer>
    <p>© 2025 Bocabella - Todos os direitos reservados</p>
  </footer>

  <div id="cart" onclick="checkout()">🛒 Carrinho (<span id="cartCount">0</span>)</div>

  <script>
    const mp = new MercadoPago('APP_USR-db02ebb2-a7d8-4d34-abc7-e0a735c757c9'); // Public Key
    let cart = [];

    function addToCart(product, price) {
      cart.push({product, price});
      document.getElementById('cartCount').innerText = cart.length;
      alert(product + " foi adicionado ao carrinho!");
    }

    async function checkout() {
      if (cart.length === 0) {
        alert("Seu carrinho está vazio.");
        return;
      }
      try {
        // Cria preferência no Mercado Pago (usando o endpoint público)
        const response = await fetch("https://api.mercadopago.com/checkout/preferences", {
          method: "POST",
          headers: {
            "Authorization": "Bearer APP_USR-1520200564050039-092113-58122989db9f82f198aa89c24474e1bf-1003409346",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            items: cart.map(item => ({
              title: item.product,
              quantity: 1,
              currency_id: "BRL",
              unit_price: item.price
            })),
            back_urls: {
              success: "https://bocabella.com.br/sucesso",
              failure: "https://bocabella.com.br/falha",
              pending: "https://bocabella.com.br/pendente"
            },
            auto_return: "approved"
          })
        });
        const data = await response.json();
        if (data.init_point) {
          window.location.href = data.init_point; // Redireciona para o pagamento
        } else {
          alert("Erro ao criar pagamento. Tente pelo WhatsApp.");
          redirectWhatsapp();
        }
      } catch (err) {
        console.error(err);
        redirectWhatsapp();
      }
    }

    function redirectWhatsapp() {
      let message = "Olá, gostaria de finalizar minha compra na Bocabella:\n\n";
      cart.forEach(item => {
        message += "- " + item.product + " (R$" + item.price.toFixed(2) + ")\n";
      });
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      message += "\nTotal: R$" + total.toFixed(2);
      window.open("https://wa.me/5511988111665?text=" + encodeURIComponent(message), "_blank");
    }
  </script>
</body>
</html>
